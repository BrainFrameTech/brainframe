# Authoritative coverage gate: runs the same pipeline as the pre-push hook
# (tool/coverage.sh) on every PR, comments the result, then enforces >=90%.
# See docs/plans/engram-storage-impl.md, Step 0.
name: coverage
on: pull_request
permissions:
  contents: read
  pull-requests: write # required to post the coverage comment
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          flutter-version-file: pubspec.yaml # the one Flutter pin: environment.flutter
      - run: flutter pub get
      # The lockfile must be exactly what the pinned Flutter resolves. The SDK
      # pins some packages (meta, test_api, clock, …) to exact versions, so a
      # lockfile produced by any other Flutter drags them, and whatever depends
      # on them, to other versions. `pub get` above quietly rewrites the file
      # rather than failing, so without this the mismatch reaches main unseen
      # and every contributor on the pinned SDK gets a dirty tree.
      - name: Check pubspec.lock matches the pinned Flutter
        env:
          FLUTTER_VERSION: ${{ steps.flutter.outputs.VERSION }}
        run: |
          if ! git diff --exit-code pubspec.lock; then
            echo "::error file=pubspec.lock::pubspec.lock was not produced by" \
              "Flutter $FLUTTER_VERSION. Run 'flutter pub get' on that version and" \
              "commit the result."
            exit 1
          fi
      - run: dart pub global activate coverde
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      # Regenerate the import-all helper, measure, and filter the documented
      # exclusions — but skip the gate so the comment (next step) posts first
      # even when coverage is low. Exclusions live only in tool/coverage.sh.
      - name: Measure coverage
        run: COVERAGE_SKIP_GATE=1 bash tool/coverage.sh
      - name: Comment coverage on the PR
        if: always() # post the number even if a later step fails
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: coverage/filtered.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true # keep a single sticky comment per PR
      # The gate, after the comment. Keep the threshold in sync with
      # COVERAGE_MINIMUM in tool/coverage.sh.
      - name: Enforce the 90% floor
        run: coverde check -i coverage/filtered.info 90
