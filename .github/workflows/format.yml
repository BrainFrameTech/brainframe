# Formatting gate: fails a PR whose Dart files are not in `dart format`'s
# style. The pre-commit hook formats on commit; this catches a commit made
# without hooks. The formatter's output depends on the SDK version, so this
# runs the Flutter pinned in pubspec.yaml, and the local toolchain must match
# it — a mismatch shows up as a PR that fails here while passing locally.
#
# A PR that changes only documentation skips the job (see docs-only.yml).
name: format
on: pull_request
permissions:
  contents: read
jobs:
  scope:
    uses: ./.github/workflows/docs-only.yml
  format:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml # the one Flutter pin: environment.flutter
          # The SDK and the pub cache, restored from main's (ci-cache.yml).
          cache: true
      # The formatter reads each package's language version from its
      # package_config.json, which pub get writes.
      - run: flutter pub get
      - name: Dart files are formatted
        run: dart format --output=none --set-exit-if-changed bin lib test tool
